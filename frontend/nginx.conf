# Production frontend: static SPA + same-origin /api proxy to the backend.
# Same-origin proxying means the browser never needs CORS for app traffic.
# (Direct API clients still use the backend's CORS policy.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API goes to the compose `backend` service (or override via your proxy).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # React-router deep links (/analyze, /admin, ...) are served by the
    # app, but unknown paths keep a REAL 404 status: error_page re-serves
    # index.html internally WITHOUT changing the 404 status code, so the
    # React 404 page renders and crawlers see a genuine 404 (not a soft 200).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;
}
