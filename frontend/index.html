<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check before you trust | CyberShield Community</title>
    <meta name="description" content="CyberShield Community helps you check suspicious messages and links, learn how scams work, and report scam patterns to protect your community." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Default social preview (per-page values are set by the app's PageMeta).
         Replace https://cybershield.example.org with the launch domain.
         og-image.png ships in frontend/public/: a plain branded mark
         (no stats, no faces, no claims). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberShield Community" />
    <meta property="og:title" content="Check before you trust | CyberShield Community" />
    <meta property="og:description" content="Check suspicious messages and links, learn how scams work, and help your community track scam patterns." />
    <meta property="og:url" content="https://cybershield.example.org/" />
    <meta property="og:image" content="https://cybershield.example.org/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Check before you trust | CyberShield Community" />
    <meta name="twitter:description" content="Check suspicious messages and links, learn how scams work, and help your community track scam patterns." />
    <meta name="twitter:image" content="https://cybershield.example.org/og-image.png" />
    <!-- Factual structured data only: no ratings, reviews, certifications or
         statistics. Replace the example.org URL with the launch domain. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CyberShield Community",
      "description": "Community cyber-safety platform: check suspicious messages and links, learn how scams work, and report scam patterns.",
      "url": "https://cybershield.example.org/",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript.",
      "offers": { "@type": "Offer", "price": "0" },
      "isAccessibleForFree": true
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
